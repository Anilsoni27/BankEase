# ==============================================================================
# BankEase Render.com Deployment Blueprint
# ==============================================================================
services:
  - type: web
    name: bankease-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ENABLED
        value: "true"
      - key: OTP_DEMO_MODE
        value: "false"
      # Default: runs with embedded demo database for 1-click zero-config deployment.
      # For persistent MySQL: remove this variable and set DB_URL, DB_USERNAME, DB_PASSWORD.
      - key: SPRING_PROFILES_ACTIVE
        value: "demo"
