# ==============================================================================
# BankEase: Demo / Free Cloud Profile (spring.profiles.active=demo)
# Runs standalone without requiring an external MySQL database instance
# ==============================================================================

# Embedded in-memory MySQL-compatible database
spring.datasource.url=jdbc:h2:mem:bankease_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Pre-populate sample testing accounts on startup
bankease.seed.enabled=true
bankease.otp.expose-in-response=${OTP_DEMO_MODE:false}

