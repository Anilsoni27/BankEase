# ==============================================================================
# BankEase: Production Profile Configuration (spring.profiles.active=prod)
# ==============================================================================

# Database schema validation (never drop or alter in live production without migration)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Demo features disabled by default in production
bankease.seed.enabled=${SEED_ENABLED:false}
bankease.otp.expose-in-response=false

# Production connection pool settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}

