# ==============================================================================
# BankEase: NextGen Net Banking - Application Configuration
# ==============================================================================

# Application Name
spring.application.name=bankease-backend

# Server Configuration
server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Connection Settings
# ------------------------------------------------------------------------------
# The JDBC URL targets the local MySQL database instance on port 3306.
# 'createDatabaseIfNotExist=true' automatically creates the database schema if missing.
spring.datasource.url=jdbc:mysql://localhost:3306/bankease_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Password placeholder - reads from DB_PASSWORD environment variable or defaults to placeholder.
# In application.properties use spring.datasource.password=YOUR_PASSWORD_HERE as a placeholder.
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD_HERE}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# Spring Data JPA / Hibernate Settings
# ------------------------------------------------------------------------------
# 'update': Automatically updates tables in MySQL to match Java entity classes without deleting data
spring.jpa.hibernate.ddl-auto=update

# 'show-sql=true': Prints generated SQL queries in the console for easy debugging & learning
spring.jpa.show-sql=true

# Format SQL output nicely across multiple lines
spring.jpa.properties.hibernate.format_sql=true

# Specify MySQL dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Enterprise Security (JWT) Configuration
# ------------------------------------------------------------------------------
# 256-bit secret key used to cryptographically sign HMAC-SHA256 JWT tokens.
# Must be provided via JWT_SECRET environment variable (minimum 32 characters, no public default).
bankease.jwt.secret=${JWT_SECRET}
bankease.jwt.expiration-ms=86400000

# ------------------------------------------------------------------------------
# Production CORS Configuration
# ------------------------------------------------------------------------------
# Restricts cross-origin requests exclusively to trusted frontend origins.
bankease.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080,http://127.0.0.1:8080

# ------------------------------------------------------------------------------
# Compliance & Demo Settings
# ------------------------------------------------------------------------------
# Controls whether OTP is exposed in the API response (for academic viva demo)
# or printed only to server console (simulating SMS gateway delivery).
bankease.otp.expose-in-response=${OTP_DEMO_MODE:false}

# Controls whether sample demo accounts are seeded into the database on startup.
# Set SEED_ENABLED=false in production!
bankease.seed.enabled=${SEED_ENABLED:true}
