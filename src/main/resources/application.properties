# ==============================================================================
# BankEase: NextGen Digital Banking - Application Configuration
# ==============================================================================

# Application Name
spring.application.name=bankease-backend

# Server Configuration (Dynamically binds to cloud platform PORT or defaults to 8080)
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# MySQL Database Connection Settings
# ------------------------------------------------------------------------------
# Supports:
# 1. Full connection string via SPRING_DATASOURCE_URL or DB_URL (Render, Railway, AWS, Heroku)
# 2. Discrete parameters: DB_HOST, DB_PORT, DB_NAME
# 3. Default fallback: localhost:3306/bankease_db
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bankease_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:YOUR_PASSWORD_HERE}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ------------------------------------------------------------------------------
# Spring Data JPA / Hibernate Settings
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Enterprise Security (JWT) Configuration
# ------------------------------------------------------------------------------
# 256-bit secret key used to cryptographically sign HMAC-SHA256 JWT tokens.
# Must be provided via JWT_SECRET environment variable (minimum 32 characters, no public default).
bankease.jwt.secret=${JWT_SECRET}
bankease.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# Production CORS Configuration
# ------------------------------------------------------------------------------
# Restricts cross-origin requests exclusively to trusted frontend origins.
bankease.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080,http://127.0.0.1:8080}

# ------------------------------------------------------------------------------
# Compliance & Demo Settings
# ------------------------------------------------------------------------------
# Controls whether OTP is exposed in the API response (for test/demo environments)
# or printed only to server console (simulating SMS gateway delivery).
bankease.otp.expose-in-response=${OTP_DEMO_MODE:false}

# Controls whether sample demo accounts are seeded into the database on startup.
# Set SEED_ENABLED=false in production!
bankease.seed.enabled=${SEED_ENABLED:true}

# Default daily compliance transfer limit (default ₹100,000.00)
bankease.compliance.default-daily-limit=${DEFAULT_DAILY_LIMIT:100000.00}
