# Test Configuration - Uses In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:bankease_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Test JWT Settings
bankease.jwt.secret=BankEaseTestSecretKeyForUnitTestsMustBeAtLeast256BitsLong2026!@#$%^&*()_+
bankease.jwt.expiration-ms=3600000

# Test CORS Settings
bankease.cors.allowed-origins=http://localhost:4200,http://localhost:8080
